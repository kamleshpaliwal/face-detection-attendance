services:
  mysql:
    image: mysql:8
    container_name: attendance_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_attendance_face_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - attendance_net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 20s
      retries: 3

  app:
    build: ./server
    container_name: face_attendance_app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE:-student_attendance_face_db}
      MILVUS_ADDRESS: milvus:19530
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      CLIENT_DIR: /client
    ports:
      - "8000:8000"
    volumes:
      - ./client:/client:ro
      - deepface_cache:/root/.deepface
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - attendance_net

  attu:
    image: zilliz/attu:v2.4.12
    container_name: face_attendance_attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8001:3000"
    depends_on:
      - milvus
    networks:
      - attendance_net

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.15
    command: [ "milvus", "run", "standalone" ]
    security_opt:
      - seccomp:unconfined
    environment:
      # Embedded etcd + local disk storage: no separate etcd/MinIO containers.
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
      - ./milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    networks:
      - attendance_net

networks:
  attendance_net:
    driver: bridge

volumes:
  mysql_data:
  deepface_cache:
